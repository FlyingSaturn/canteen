<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canteen Queue Optimizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .content {
            padding: 40px;
        }
        
        .control-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        
        .control-section label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #333;
        }
        
        .control-section input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }
        
        .control-section input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 30px;
        }
        
        .counter-result {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border-left: 5px solid #667eea;
        }
        
        .counter-result.b {
            border-left-color: #764ba2;
        }
        
        .counter-result h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        
        .metrics {
            margin-bottom: 20px;
        }
        
        .metric {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }
        
        .metric:last-child {
            border-bottom: none;
        }
        
        .metric-label {
            font-weight: 600;
            color: #555;
        }
        
        .metric-value {
            color: #667eea;
            font-weight: bold;
        }
        
        .batches {
            margin-top: 20px;
        }
        
        .batches h3 {
            font-size: 1.1em;
            margin-bottom: 15px;
            color: #333;
        }
        
        .batch-item {
            background: white;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 5px;
            border-left: 3px solid #667eea;
        }
        
        .batch-item.b {
            border-left-color: #764ba2;
        }
        
        .batch-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        
        .batch-info {
            font-size: 0.9em;
            color: #666;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            display: none;
        }
        
        @media (max-width: 768px) {
            .results {
                grid-template-columns: 1fr;
            }
            
            header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏪 Canteen Queue Optimizer</h1>
            <p>Optimize food service with intelligent batching</p>
        </header>
        
        <div class="content">
            <div class="control-section">
                <label for="numCustomers">Number of Customers:</label>
                <input type="number" id="numCustomers" value="10" min="1" max="100">
                <button onclick="runSimulation()">Run Simulation</button>
            </div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Running simulation...</p>
            </div>
            
            <div class="error" id="error"></div>
            
            <div class="results" id="results" style="display: none;">
                <div class="counter-result">
                    <h2>Counter A (0+0j)</h2>
                    <div class="metrics">
                        <div class="metric">
                            <span class="metric-label">Total Cost:</span>
                            <span class="metric-value" id="costA">-</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Customers Served:</span>
                            <span class="metric-value" id="customersA">-</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Cost/Customer:</span>
                            <span class="metric-value" id="efficiencyA">-</span>
                        </div>
                    </div>
                    <div class="batches" id="batchesA"></div>
                </div>
                
                <div class="counter-result b">
                    <h2>Counter B (0+3j)</h2>
                    <div class="metrics">
                        <div class="metric">
                            <span class="metric-label">Total Cost:</span>
                            <span class="metric-value" id="costB">-</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Customers Served:</span>
                            <span class="metric-value" id="customersB">-</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Cost/Customer:</span>
                            <span class="metric-value" id="efficiencyB">-</span>
                        </div>
                    </div>
                    <div class="batches" id="batchesB"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        async function runSimulation() {
            const numCustomers = document.getElementById('numCustomers').value;
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const results = document.getElementById('results');
            
            error.style.display = 'none';
            loading.style.display = 'block';
            results.style.display = 'none';
            
            try {
                const response = await fetch('/api/simulate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ num_customers: numCustomers })
                });
                
                const data = await response.json();
                loading.style.display = 'none';
                
                if (!data.success) {
                    error.textContent = 'Error: ' + data.error;
                    error.style.display = 'block';
                    return;
                }
                
                // Display metrics
                const metricsA = data.metrics.counter_a;
                const metricsB = data.metrics.counter_b;
                
                document.getElementById('costA').textContent = metricsA.total_cost.toFixed(2);
                document.getElementById('customersA').textContent = metricsA.customers_served;
                document.getElementById('efficiencyA').textContent = 
                    (metricsA.total_cost / metricsA.customers_served).toFixed(2);
                
                document.getElementById('costB').textContent = metricsB.total_cost.toFixed(2);
                document.getElementById('customersB').textContent = metricsB.customers_served;
                document.getElementById('efficiencyB').textContent = 
                    (metricsB.total_cost / metricsB.customers_served).toFixed(2);
                
                // Display batches
                displayBatches(data.batches_a, 'batchesA');
                displayBatches(data.batches_b, 'batchesB');
                
                results.style.display = 'grid';
            } catch (err) {
                loading.style.display = 'none';
                error.textContent = 'Network error: ' + err.message;
                error.style.display = 'block';
            }
        }
        
        function displayBatches(batches, elementId) {
            const container = document.getElementById(elementId);
            let html = '<h3>Batching Order</h3>';
            
            let tripNum = 1;
            for (const [item, info] of Object.entries(batches)) {
                html += `
                    <div class="batch-item">
                        <div class="batch-name">Trip ${tripNum}: ${item}</div>
                        <div class="batch-info">
                            Cost: ${info.cost.toFixed(2)} | 
                            Qty: ${info.total_qty} | 
                            Customers: ${info.customers.join(', ')}
                        </div>
                    </div>
                `;
                tripNum++;
            }
            
            container.innerHTML = html;
        }
        
        // Run on Enter key
        document.getElementById('numCustomers').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') runSimulation();
        });
    </script>
</body>
</html>
